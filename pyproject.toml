[project]
name = "astroai-workload"
version = "0.2.0"
description = "Ray Jobs + CANFAR Ray cluster lifecycle for AstroAI workloads"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSES/MIT.txt"]
authors = [{ name = "Simon Fabbro" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
]

# Extras keep heavy/optional backends out of lean images:
#   [cluster]  canfar client — create/stop CANFAR sessions (py3.13-safe)
#   [jobs]     ray[default]  — Ray Jobs client + Ray-native autoscaler (cp312 only)
#   [all]      both
[project.optional-dependencies]
jobs = ["ray[default]>=2.40"]
cluster = ["canfar>=1.4.1"]
all = ["ray[default]>=2.40", "canfar>=1.4.1"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.8",
    "canfar>=1.4.1",
]

[project.urls]
Homepage = "https://github.com/astroai/astroai-workload"
Repository = "https://github.com/astroai/astroai-workload"
Issues = "https://github.com/astroai/astroai-workload/issues"

[project.scripts]
astroai-workload = "astroai_workload.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astroai_workload"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "BLE", "SIM", "PIE"]
